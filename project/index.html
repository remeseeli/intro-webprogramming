<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- FontAwesome for the running icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="theme-default">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Weather App</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarControls">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarControls">
                <form class="d-flex flex-wrap flex-lg-nowrap me-auto mt-3 mt-lg-0 gap-2" id="search-form">
                    <input class="form-control flex-grow-1" type="search" id="search-input" placeholder="City name (e.g., Paris, FR)" required>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-light" type="submit">Search</button>
                        <button class="btn btn-info" type="button" id="geo-btn">📍</button>
                    </div>
                </form>
                <div class="d-flex align-items-center mt-3 mt-lg-0 gap-3">
                    <select class="form-select" id="unit-toggle">
                        <option value="celsius">Celsius (°C)</option>
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>
                    <div class="dropdown">
                        <button class="btn btn-secondary dropdown-toggle" type="button" id="favDropdown" data-bs-toggle="dropdown">
                            Favorites
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" id="favorites-list">
                            <!-- Favorites injected here -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="error-message" class="alert alert-danger d-none"></div>

        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card weather-card h-100 text-center">
                    <div class="card-body" id="current-weather">
                        <h2 id="city-name" class="card-title">Search a Location</h2>
                        <button class="btn btn-sm btn-outline-warning mb-2" id="add-fav-btn">Add to Favorites</button>
                        <div id="current-icon"></div>
                        <h1 id="current-temp" class="display-1">--</h1>
                        <p id="current-desc" class="lead">--</p>
                    </div>
                </div>
            </div>
            
            <div class="col-md-8 mb-4">
                <div class="card weather-card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Running Condition:</h5>
                        <div id="running-icon" class="display-1 my-3 text-center"></div>
                        <div id="running-condition" class="display-6 mt-4 text-center">--</div>
                        <p id="running-desc" class="text-center mt-2">Waiting for weather data...</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-12">
                <div class="card weather-card">
                    <div class="card-body">
                        <h5 class="card-title">24-Hour Forecast Comparison (Open-Meteo vs WeatherAPI)</h5>
                        <div id="forecastChart"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card weather-card mb-5">
                    <div class="card-body">
                        <h5 class="card-title">7-Day Forecast</h5>
                        <div class="d-flex flex-wrap justify-content-between" id="seven-day-forecast">
                            <!-- Forecast days injected here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://unpkg.com/frappe-charts@1.6.2/dist/frappe-charts.min.umd.js" defer></script>
    <script src="script.js"></script>
</body>
</html>
